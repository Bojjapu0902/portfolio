<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/img/favicon.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171717" />
    <meta
      name="description"
      content="B Srinivas — UI/UX Designer and Front-End Developer based in Hyderabad, India. 14+ years designing and building enterprise platforms, SaaS dashboards and responsive web applications. Open to new opportunities."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/img/favicon.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ***** All CSS Files ***** -->

    <!-- Design-system typeface (Inter — the free substitute named in
         doc/desing system/designsystem.md for Monument Grotesk). Loaded
         before style.css so --primary-font/--secondary-font resolve to a
         face that's already on its way in. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Style css -->
    <link rel="stylesheet" href="%PUBLIC_URL%/assets/css/style.css">
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>B Srinivas — UI/UX Designer &amp; Front-End Developer</title>
    <meta name="author" content="B Srinivas" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="B Srinivas — UI/UX Designer &amp; Front-End Developer" />
    <meta property="og:description" content="14+ years designing and building enterprise platforms, SaaS dashboards and responsive web applications. Open to new opportunities." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- ***** All Plugins ***** -->

    <!-- Core js -->
    <script src="/assets/js/vendor/core.min.js"></script>

	<!-- Bootstrap js -->
	<script src="/assets/js/vendor/popper.min.js"></script>
	<script src="/assets/js/vendor/bootstrap.min.js"></script>

	<!-- Plugins js -->
	<script src="/assets/js/vendor/all.min.js"></script>
	<script src="/assets/js/vendor/gsap.min.js"></script>
	<script src="/assets/js/vendor/ScrollTrigger.min.js"></script>
	<script src="/assets/js/vendor/shuffle.min.js"></script>
	<script src="/assets/js/vendor/gallery.min.js"></script>
	<script src="/assets/js/vendor/slider.min.js"></script>

	<!-- Main js -->
	<script src="/assets/js/main.js"></script>
  </body>
</html>
